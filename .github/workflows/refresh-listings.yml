name: Refresh live listings (daily)

# Pulls fresh property listings into data/listings.json once a day via the
# Domain Developer API, then commits the change (which re-publishes Pages on a
# branch deploy). With no Domain credentials set, the script is a safe no-op and
# the committed sample data is left in place. NOTE: this uses the official API,
# it does NOT scrape any portal.

on:
  schedule:
    - cron: '17 19 * * *'   # ~05:17 AWST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/repo-connection-mhn1nl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch listings
        env:
          DOMAIN_CLIENT_ID: ${{ secrets.DOMAIN_CLIENT_ID }}
          DOMAIN_CLIENT_SECRET: ${{ secrets.DOMAIN_CLIENT_SECRET }}
          DOMAIN_ACCESS_TOKEN: ${{ secrets.DOMAIN_ACCESS_TOKEN }}
        run: python3 scripts/fetch_listings.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/listings.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/listings.json
            git commit -m "Refresh live listings (automated)"
            git push origin claude/repo-connection-mhn1nl
          else
            echo "No listing changes to commit."
          fi
