name: Refresh live listings (weekly)

# Pulls fresh property listings (with photos) into data/listings.json once a day
# via the Realty in AU API (RapidAPI), then commits the change (which re-
# publishes Pages on a branch deploy). With no RAPIDAPI_KEY set, the script is a
# safe no-op and the committed data is left in place.
#
# QUOTA: the sweep covers every residential suburb within 15km of the Perth CBD
# (data/perth_ring.json), which is one API call per suburb, so roughly 143 calls
# a run and ~4,300 a month. The "Sweep plan" step below prints the exact number
# into the log before anything is spent. To run cheaper, set SUBURB_CAP to the
# slice size and rotate SUBURB_OFFSET so the whole ring is still covered over
# several days.

on:
  schedule:
    # Saturday 06:47 AWST (Friday 22:47 UTC): fresh listings before the weekend
    # home opens, which is when they actually get used. The odd minute is
    # deliberate; scheduled jobs queued on the hour are the ones GitHub delays.
    - cron: '47 22 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~143 sequential API calls with a throttle; well inside this, but bounded
    # so a hanging endpoint cannot burn a job slot.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/repo-connection-mhn1nl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sweep plan (how much quota this run will spend)
        run: python3 scripts/fetch_listings.py --plan

      - name: Fetch listings
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # Weekly, whole ring: 143 calls a run, ~613 a month. That is more
          # than the RapidAPI BASIC plan appears to allow (a single full sweep
          # exhausted September's quota), but an over-quota sweep is no longer
          # dangerous: it stops early, publishes what it got balanced across
          # north / east / south / west, rotates its starting point so a
          # different part of the ring is reached next week, and the page states
          # which sides were not searched. Coverage accumulates across the
          # rolling window instead of collapsing to one direction.
          #
          # To fit a known quota instead, set SUBURB_CAP to the suburbs per run
          # and keep the cycle inside WINDOW_DAYS:
          #   python3 scripts/fetch_listings.py --plan   (prints both, and warns)
        run: python3 scripts/fetch_listings.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/listings.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/listings.json
            git commit -m "Refresh live listings (automated)"
            git push origin claude/repo-connection-mhn1nl
          else
            echo "No listing changes to commit."
          fi
